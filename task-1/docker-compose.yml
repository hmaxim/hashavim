services:
  usage-metering:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DB_PATH: /data/usage.db
      DEFAULT_LIMIT: "${DEFAULT_LIMIT:-100}"
      PERIOD: "${PERIOD:-daily}"
      AI_FAILURE_RATE: "${AI_FAILURE_RATE:-0.15}"
      AI_MIN_DELAY_MS: "${AI_MIN_DELAY_MS:-50}"
      AI_MAX_DELAY_MS: "${AI_MAX_DELAY_MS:-500}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-2000}"
      RESERVATION_TTL_SECONDS: "${RESERVATION_TTL_SECONDS:-30}"
      SWEEPER_INTERVAL_MS: "${SWEEPER_INTERVAL_MS:-5000}"
      # Unset disables the admin limit route.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    volumes:
      - usage_data:/data
    # Single replica only: SQLite is not safe for multi-writer scale-out.
    stop_grace_period: 30s

volumes:
  usage_data:
